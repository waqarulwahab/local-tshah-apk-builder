name: Build APK (Java v2)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build ID'
        required: true
      tenant_id:
        description: 'Tenant ID'
        required: false
        default: ''
      channel_id:
        description: 'Channel / tenant slug'
        required: true
        default: 'default'
      backend_url:
        description: 'Tenant tunnel URL (e.g. https://slug.waqarulwahab.me)'
        required: true
      app_name:
        description: 'App display name'
        required: true
      package_name:
        description: 'Android package name'
        required: false
        default: 'come.tshah.app'
      permissions:
        description: 'JSON array of Android permission strings'
        required: false
        default: '[]'
      app_url:
        description: 'WebView target URL'
        required: false
        default: ''
      webhook_url:
        description: 'POST URL to report build status back to local backend'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Status → building ─────────────────────────────────────────────────
      - name: Notify building
        run: |
          curl -sf -X POST "${{ inputs.webhook_url }}" \
            -H "Content-Type: application/json" \
            -d "{\"buildId\":\"${{ inputs.build_id }}\",\"status\":\"building\"}" \
            || echo "Webhook ping failed (non-fatal)"

      # ── 4. Restore or generate debug keystore ────────────────────────────────
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Stable keystore restored from secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set — generating one-time keystore (signature changes each build)"
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
            echo "Keystore generated."
          fi

      # ── 5. Write google-services.json (real from secret, else placeholder) ──
      - name: Write Firebase config
        working-directory: java-apk
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "Real google-services.json restored from secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_B64 not set — using placeholder (FCM push will not work)"
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "100000000001",
              "project_id": "local-tshah-build",
              "storage_bucket": "local-tshah-build.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000001:android:aabbccddeeff0011",
                "android_client_info": {"package_name": "come.tshah.app"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyBuildPlaceholder0000000000000000a"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      # ── 6. Patch app display name ─────────────────────────────────────────────
      - name: Patch app name
        env:
          APP_TITLE: ${{ inputs.app_name }}
        working-directory: java-apk
        run: |
          python3 - <<'PY'
          import os, re
          from xml.sax.saxutils import escape
          title = os.environ['APP_TITLE']
          safe  = escape(title, {'"': '&quot;'})
          path  = 'app/src/main/AndroidManifest.xml'
          with open(path) as f: xml = f.read()
          # Patch only the <application android:label="..."> attribute
          xml = re.sub(
              r'(<application\b[^>]*\bandroid:label=")[^"]*(")',
              lambda m: m.group(1) + safe + m.group(2),
              xml, count=1
          )
          with open(path, 'w') as f: f.write(xml)
          print(f'App name patched: {title}')
          PY

      # ── 7. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        working-directory: java-apk
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PCHANNEL_ID="${{ inputs.channel_id }}" \
            -PBACKEND_URL="${{ inputs.backend_url }}" \
            -PAPP_URL="${{ inputs.app_url }}" \
            --no-daemon

      # ── 8. Upload APK to GitHub Release ──────────────────────────────────────
      - name: Upload APK to GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          APK="java-apk/app/build/outputs/apk/release/app-release.apk"
          TAG="build-${BUILD_ID}"
          gh release create "$TAG" "$APK#app.apk" \
            --title "${APP_NAME} (${BUILD_ID})" \
            --notes "Java build — tenant: ${{ inputs.channel_id }}" \
            --repo "$GITHUB_REPOSITORY"
          DOWNLOAD_URL=$(gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.name=="app.apk") | .browserDownloadUrl' \
            --repo "$GITHUB_REPOSITORY")
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "APK URL: $DOWNLOAD_URL"

      # ── 9. Notify done ────────────────────────────────────────────────────────
      - name: Notify done
        env:
          WEBHOOK_URL:  ${{ inputs.webhook_url }}
          BUILD_ID:     ${{ inputs.build_id }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
        run: |
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"buildId\":\"$BUILD_ID\",\"status\":\"done\",\"downloadUrl\":\"$DOWNLOAD_URL\"}"

      # ── 10. Notify failed ─────────────────────────────────────────────────────
      - name: Notify failed
        if: ${{ failure() || cancelled() }}
        env:
          WEBHOOK_URL: ${{ inputs.webhook_url }}
          BUILD_ID:    ${{ inputs.build_id }}
        run: |
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"buildId\":\"$BUILD_ID\",\"status\":\"failed\"}" || true
